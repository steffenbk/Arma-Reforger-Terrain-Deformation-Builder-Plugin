<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="380" rx="12" fill="#f4f1ea"/>
  <defs>
    <pattern id="mud" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#c79a6b"/><path d="M0 10 L10 0" stroke="#b5875a" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#2b2b2b">What the cut keeps and what becomes mud ground (seen from above)</text>

  <!-- map -->
  <g transform="translate(30,56)">
    <rect width="540" height="300" rx="6" fill="url(#mud)" stroke="#9c8a6c"/>
    <!-- road strip kept (real terrain) -->
    <path d="M0 200 C120 180 200 120 300 130 S470 220 540 190" stroke="#7da35f" stroke-width="34" fill="none"/>
    <path d="M0 200 C120 180 200 120 300 130 S470 220 540 190" stroke="#6b6b6b" stroke-width="12" fill="none"/>
    <!-- buildings kept -->
    <rect x="320" y="30" width="50" height="40" fill="#7da35f"/><rect x="330" y="38" width="30" height="24" fill="#a35a3a"/>
    <rect x="390" y="50" width="56" height="44" fill="#7da35f"/><rect x="400" y="58" width="36" height="28" fill="#a35a3a"/>
    <!-- power pole kept -->
    <rect x="150" y="60" width="14" height="14" fill="#7da35f"/><circle cx="157" cy="67" r="3" fill="#333"/>
    <!-- trees: holed (on mud) -->
    <g fill="#3f6b33"><circle cx="70" cy="70" r="12"/><circle cx="95" cy="95" r="10"/><circle cx="60" cy="110" r="9"/><circle cx="470" cy="270" r="12"/><circle cx="500" cy="250" r="9"/></g>
    <!-- keep box (green) -->
    <rect x="200" y="225" width="80" height="55" fill="#7da35f" fill-opacity="0.55" stroke="#2f7d2f" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="240" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5a1f">keep box</text>
    <!-- mud box (red) -->
    <rect x="455" y="110" width="70" height="50" fill="url(#mud)" stroke="#b5332f" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="490" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#8a1f1c">mud box</text>
  </g>

  <!-- legend -->
  <g transform="translate(600,70)" font-size="13" fill="#3a3a3a">
    <rect width="22" height="22" fill="#7da35f"/>
    <text x="34" y="10" font-weight="700">Stays real terrain</text>
    <text x="34" y="27" fill="#666">roads, asphalt / concrete, buildings,</text>
    <text x="34" y="43" fill="#666">power poles. Can't be dug.</text>

    <rect y="70" width="22" height="22" fill="url(#mud)"/>
    <text x="34" y="80" font-weight="700">Becomes mud ground</text>
    <text x="34" y="97" fill="#666">everything else, including under trees,</text>
    <text x="34" y="113" fill="#666">bushes, rocks and props. Ruts, craters,</text>
    <text x="34" y="129" fill="#666">trenches and tunnels work here.</text>

    <rect y="160" width="22" height="22" fill="none" stroke="#2f7d2f" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="34" y="170" font-weight="700">Keep box (green)</text>
    <text x="34" y="187" fill="#666">force real terrain in this square</text>

    <rect y="210" width="22" height="22" fill="none" stroke="#b5332f" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="34" y="220" font-weight="700">Mud box (red)</text>
    <text x="34" y="237" fill="#666">force mud ground in this square</text>

    <text y="275" fill="#6b6b6b">Paint boxes with the MUD Cut Editor tool,</text>
    <text y="292" fill="#6b6b6b">then cut (again). Boxes are normal entities.</text>
  </g>
</svg>

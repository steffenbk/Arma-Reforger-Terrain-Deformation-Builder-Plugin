<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="12" fill="#f4f1ea"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#2b2b2b">Plan trench mode (seen from above)</text>

  <g transform="translate(30,54)">
    <rect width="520" height="250" rx="6" fill="#a7bf7f" stroke="#8aa063"/>
    <!-- road -->
    <path d="M330 0 L380 250" stroke="#7a7a7a" stroke-width="26"/>
    <!-- trench pieces -->
    <g stroke-linecap="round" fill="none">
      <path d="M60 190 L170 120" stroke="#6b5236" stroke-width="22" stroke-opacity="0.85"/>
      <path d="M170 120 Q250 60 300 110" stroke="#6b5236" stroke-width="22" stroke-opacity="0.85"/>
      <path d="M300 110 L365 140" stroke="#c0392b" stroke-width="22" stroke-opacity="0.85"/>
      <path d="M365 140 L470 170" stroke="#6b5236" stroke-width="22" stroke-opacity="0.85"/>
    </g>
    <!-- points -->
    <g fill="#fff" stroke="#2b2b2b" stroke-width="2">
      <circle cx="60" cy="190" r="7"/><circle cx="170" cy="120" r="7"/><circle cx="300" cy="110" r="7"/><circle cx="470" cy="170" r="7"/>
    </g>
    <g font-size="12" font-weight="700" fill="#2b2b2b">
      <text x="44" y="215">1</text><text x="160" y="146">2</text><text x="296" y="136">3</text><text x="476" y="196">4</text>
    </g>
    <text x="210" y="62" font-size="12" fill="#2b2b2b">bent with V</text>
    <text x="372" y="112" font-size="12" font-weight="700" fill="#8a1f1c">red = road / hard</text>
    <text x="372" y="127" font-size="12" font-weight="700" fill="#8a1f1c">ground, not dug</text>
  </g>

  <g transform="translate(580,62)" font-size="13" fill="#3a3a3a">
    <g font-weight="700">
      <text y="16">Left mouse</text><text y="44">Right mouse</text><text y="72">V</text><text y="100">Mouse wheel</text>
      <text y="128">X</text><text y="156">C</text><text y="184">F</text><text y="228">R</text>
    </g>
    <g>
      <text x="110" y="16">place a point</text>
      <text x="110" y="44">undo last point</text>
      <text x="110" y="72">bend the segment under the aim</text>
      <text x="110" y="100">depth (0.25 m steps, up to 4 m)</text>
      <text x="110" y="128">width</text>
      <text x="110" y="156">wall angle (45 to 90 deg)</text>
      <text x="110" y="184">confirm - the plan stays as an outline</text>
      <text x="110" y="200" fill="#666">that is then dug out with the shovel</text>
      <text x="110" y="228">next mode (build area)</text>
    </g>
  </g>
</svg>
